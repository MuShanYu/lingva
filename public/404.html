<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>LingVa</title>
    <script type="text/javascript">
      // GitHub Pages 不支持前端路由的直接刷新/深链，这里把路径编码进 query
      // 转发回 index.html，由 index.html 里的脚本解码还原，交给 react-router 接管。
      var pathSegmentsToKeep = 1 // 仓库名 /lingva/ 本身要保留
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
